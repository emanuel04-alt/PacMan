<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ethan's Arcade — Pac-Man</title>
<style>
:root{color-scheme:dark;--bg:#070b1b;--panel:#101a39;--blue:#315cff;--yellow:#ffe34d;--muted:#a9b8df}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#17265b 0,#070b1b 55%);color:#f7f8ff;font-family:system-ui,Segoe UI,Arial,sans-serif;display:flex;justify-content:center;padding:26px 14px}
main{width:min(760px,100%);text-align:center}.brand{font-weight:900;letter-spacing:.16em;color:var(--yellow);font-size:clamp(25px,5vw,42px);text-shadow:0 0 18px #ffe34d55}.tag{color:var(--muted);margin:4px 0 20px;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.panel{background:#080d20eF;border:1px solid #344b9b;border-radius:18px;padding:clamp(10px,3vw,20px);box-shadow:0 18px 60px #0008,0 0 30px #315cff22}
.hud{display:flex;justify-content:space-between;gap:10px;margin:0 auto 12px;max-width:570px;color:var(--yellow);font-weight:800;font-family:ui-monospace,monospace;font-size:clamp(12px,2.5vw,16px)}
canvas{display:block;width:min(100%,570px);height:auto;margin:auto;background:#030611;border:2px solid #263d9c;border-radius:7px;image-rendering:pixelated}
.controls{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px}
button{border:1px solid #536ac0;border-radius:10px;background:#182754;color:white;padding:11px 16px;font-weight:800;cursor:pointer;touch-action:manipulation}
button:hover{background:#263d7a}button:active{transform:scale(.97)}.primary{background:var(--yellow);border-color:var(--yellow);color:#101426}.status{min-height:24px;margin:12px 0 4px;color:var(--yellow);font-weight:700}
.instructions{color:var(--muted);font-size:12px;line-height:1.7;margin-top:12px}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,42px);gap:5px;margin:15px auto 0;width:max-content}
.dpad button{padding:4px;font-size:19px}.empty{visibility:hidden}
footer{color:#7282b5;font-size:11px;margin-top:17px}
@media(min-width:650px){.dpad{display:none}}
</style>
</head>
<body>
<main>
  <div class="brand">ETHAN'S ARCADE</div>
  <div class="tag">Insert coin · Chase the high score</div>
  <section class="panel">
    <div class="hud">
      <span>SCORE <b id="score">0</b></span>
      <span>BEST <b id="best">0</b></span>
      <span>LEVEL <b id="level">1</b></span>
      <span>LIVES <b id="lives">3</b></span>
    </div>
    <canvas id="game" width="456" height="504" aria-label="Pac-Man arcade game"></canvas>
    <div class="controls">
      <button class="primary" id="start">▶ START</button>
      <button id="pause">Ⅱ PAUSE</button>
      <button id="restart">↻ NEW GAME</button>
      <button id="sound">♪ SOUND: ON</button>
    </div>
    <div class="status" id="status" aria-live="polite">PRESS START TO PLAY</div>
    <div class="dpad" aria-label="Touch controls">
      <span class="empty"></span><button data-dir="up">▲</button><span class="empty"></span>
      <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
    </div>
    <div class="instructions">MOVE: ARROW KEYS or WASD · SPACE: PAUSE<br>Eat every dot. Grab power pellets to chase the ghosts!</div>
  </section>
  <footer>Made for the love of the arcade.</footer>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id),T=24,W=19,H=21;
const layout=[
"###################",
"#........#........#",
"#.##.###.#.###.##.#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.###.#.###.####",
"   #.#.......#.#   ",
"####.#.## ##.#.####",
"     .#     #.     ",
"####.#.#####.#.####",
"   #.#.......#.#   ",
"####.#.#####.#.####",
"#........#........#",
"#.##.###.#.###.##.#",
"#o.#...........#.o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.###########.##..#",
"###################"
];
const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const ghostColors=['#ff5264','#ff9bd2','#42e8ed','#ffb64a'];
let map,player,ghosts,score=0,lives=3,level=1,power=0,bonus=200,running=false,paused=false,over=false,last=0,acc=0,sound=true,audio=null;
let best=Number(localStorage.getItem('ethansArcadeBest')||0);
$('best').textContent=best;
function initLevel(){
 map=layout.map(r=>r.split(''));
 player={x:9,y:15,dir:'left',next:'left'};
 ghosts=ghostColors.map((color,i)=>({x:[8,9,10,9][i],y:[9,9,9,10][i],color,dir:['left','up','right','down'][i],home:{x:[8,9,10,9][i],y:[9,9,9,10][i]}}));
 power=0;bonus=200;
}
function wall(x,y){return y<0||y>=H||x<0||x>=W||map[y][x]==='#'}
function move(o){const d=dirs[o.dir];if(!d)return;let nx=o.x+d.x,ny=o.y+d.y;if(ny===10&&(nx<0||nx>=W)){o.x=(nx+W)%W;return}if(!wall(nx,ny)){o.x=nx;o.y=ny}}
function chirp(freq=440,duration=.055){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(.045,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch(e){}}
function hud(){$('score').textContent=score;$('lives').textContent=lives;$('level').textContent=level;if(score>best){best=score;localStorage.setItem('ethansArcadeBest',best);$('best').textContent=best}}
function updatePlayer(){
 const d=dirs[player.next],nx=player.x+d.x,ny=player.y+d.y;
 if(!wall(nx,ny))player.dir=player.next;
 move(player);
 const c=map[player.y][player.x];
 if(c==='.'||c==='o'){map[player.y][player.x]=' ';score+=c==='.'?10:50;chirp(c==='o'?740:520);if(c==='o'){power=7;bonus=200;ghosts.forEach(g=>g.dir=({up:'down',down:'up',left:'right',right:'left'})[g.dir])}hud()}
 if(!map.some(r=>r.some(c=>c==='.'||c==='o'))){level++;hud();initLevel();$('status').textContent='LEVEL '+level+' — HERE WE GO!';chirp(880,.2)}
}
function updateGhost(g){
 let opts=Object.keys(dirs).filter(dir=>{let d=dirs[dir],nx=g.x+d.x,ny=g.y+d.y;return !wall(nx,ny)&&nx>=0&&nx<W&&dir!==({up:'down',down:'up',left:'right',right:'left'})[g.dir]});
 if(!opts.length){g.dir=({up:'down',down:'up',left:'right',right:'left'})[g.dir];return}
 if(Math.random()<.24||!opts.includes(g.dir)){
  if(power>0||Math.random()<.22)g.dir=opts[Math.floor(Math.random()*opts.length)];
  else g.dir=opts.map(dir=>{let d=dirs[dir];return{dir,dist:Math.abs(g.x+d.x-player.x)+Math.abs(g.y+d.y-player.y)+Math.random()*2}}).sort((a,b)=>a.dist-b.dist)[0].dir;
 }
 move(g);
}
function collisions(){for(const g of ghosts)if(g.x===player.x&&g.y===player.y){if(power>0){score+=bonus;bonus*=2;hud();g.x=g.home.x;g.y=g.home.y;chirp(180,.13)}else{lives--;hud();chirp(100,.25);if(lives<=0){over=true;running=false;$('status').textContent='GAME OVER — SCORE '+score+' · NEW GAME TO TRY AGAIN'}else{initLevel();$('status').textContent='CAUGHT! '+lives+' LIVES LEFT'}break}}}
function draw(){
 ctx.fillStyle='#030611';ctx.fillRect(0,0,456,504);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c=map[y][x],px=x*T,py=y*T;
  if(c==='#'){ctx.fillStyle='#101c70';ctx.fillRect(px,py,T,T);ctx.strokeStyle='#416aff';ctx.lineWidth=1.3;ctx.strokeRect(px+2,py+2,T-4,T-4)}
  else if(c==='.'){ctx.fillStyle='#fff0b0';ctx.beginPath();ctx.arc(px+12,py+12,2.1,0,7);ctx.fill()}
  else if(c==='o'){ctx.fillStyle='#ffe34d';ctx.beginPath();ctx.arc(px+12,py+12,6+Math.sin(Date.now()/130),0,7);ctx.fill()}
 }
 ghosts.forEach(g=>{let x=g.x*T+12,y=g.y*T+12;ctx.fillStyle=power>0?(power<2&&Math.floor(Date.now()/150)%2?'#fff':'#2867ee'):g.color;ctx.beginPath();ctx.arc(x,y-2,9,Math.PI,0);ctx.lineTo(x+9,y+8);ctx.lineTo(x+4,y+5);ctx.lineTo(x,y+9);ctx.lineTo(x-4,y+5);ctx.lineTo(x-9,y+8);ctx.closePath();ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(x-3,y-3,3,0,7);ctx.arc(x+3,y-3,3,0,7);ctx.fill();ctx.fillStyle='#172044';ctx.beginPath();ctx.arc(x-3,y-3,1.5,0,7);ctx.arc(x+3,y-3,1.5,0,7);ctx.fill()});
 let x=player.x*T+12,y=player.y*T+12,a={right:0,left:Math.PI,up:-Math.PI/2,down:Math.PI/2}[player.dir],m=.18+Math.abs(Math.sin(Date.now()/85))*.35;
 ctx.fillStyle='#ffe32d';ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,10,a+m,a+Math.PI*2-m);ctx.closePath();ctx.fill();
 if(paused||!running){ctx.fillStyle='#030611bb';ctx.fillRect(0,0,456,504);ctx.textAlign='center';ctx.fillStyle='#ffe34d';ctx.font='bold 27px monospace';ctx.fillText(over?'GAME OVER':paused?'PAUSED': 'PAC-MAN',228,238);ctx.fillStyle='white';ctx.font='13px monospace';ctx.fillText(over?'PRESS NEW GAME':paused?'PRESS SPACE TO RESUME':'PRESS START TO PLAY',228,266)}
}
function tick(){if(running&&!paused&&!over){updatePlayer();if(power>0)power=Math.max(0,power-.035);if(Math.random()<.8)ghosts.forEach(updateGhost);collisions()}draw()}
function frame(t){let dt=Math.min(t-last,100);last=t;acc+=dt;while(acc>=145){tick();acc-=145}requestAnimationFrame(frame)}
function start(){if(over)return;running=true;paused=false;$('status').textContent='GOOD LUCK!'}
function reset(){score=0;lives=3;level=1;over=paused=running=false;hud();initLevel();$('status').textContent='PRESS START TO PLAY';draw()}
function steer(d){player.next=d;if(!running&&!over)start()}
document.addEventListener('keydown',e=>{let k={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(k[e.key]){e.preventDefault();steer(k[e.key])}if(e.code==='Space'){e.preventDefault();if(running){paused=!paused;$('status').textContent=paused?'PAUSED':'KEEP GOING!'}else if(!over)start()}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();steer(b.dataset.dir)}));
$('start').onclick=start;$('pause').onclick=()=>{if(running){paused=!paused;$('status').textContent=paused?'PAUSED':'KEEP GOING!'}};$('restart').onclick=reset;
$('sound').onclick=()=>{sound=!sound;$('sound').textContent='♪ SOUND: '+(sound?'ON':'OFF');if(sound)chirp()};
initLevel();draw();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
